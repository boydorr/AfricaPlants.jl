# The cleaned records within Africa's outline, each given the WFO species its name means, as a
# preparation run: its inputs are read from the registry where the plain script reads them, and the
# table it writes is registered with its provenance record. From the root of the repository:
#
#     fair run data/src/prepare-africa.yaml
run_metadata:
  description: The cleaned records within Africa's outline, each given the WFO species its name means
  default_input_namespace: AfricaPlants
  default_output_namespace: AfricaPlants
  # `JULIA_NUM_THREADS` where it is set, else every core: `fair` runs this with `sh`, which expands it.
  script: |
    julia --threads=${JULIA_NUM_THREADS:-auto} --project data/src/species_traits.jl --force

register:
- namespace: AfricaPlants
  full_name: AfricaPlants
  website: https://github.com/boydorr/AfricaPlants.jl

# Each source's files and records in its own namespace, and each table of ours in this one.
read:
- data_product: CaseStudy/Data/Records/data/*
- data_product: CaseStudy/Data/Records/provenance/*
- data_product: worldclim/data/*
  use:
    namespace: WorldClim
- data_product: worldclim/provenance/*
  use:
    namespace: WorldClim
- data_product: naturalearth/data/*
  use:
    namespace: NaturalEarth
- data_product: naturalearth/provenance/*
  use:
    namespace: NaturalEarth
- data_product: wfo/data/*
  use:
    namespace: WFO
- data_product: wfo/provenance/*
  use:
    namespace: WFO

write:
- data_product: CaseStudy/Data/RecordsAfrica/data/*
  description: Plant records within Africa's outline, each with its WFO species
  file_type: csv
- data_product: CaseStudy/Data/RecordsAfrica/provenance/*
  description: EcoSISTEM's provenance record of the table
  file_type: toml
