# The mean EVI over the Africa box where it rests on enough months, as the seeding reads it, as a
# preparation run: its inputs are read from the registry where the plain script reads them, and the
# table it writes is registered with its provenance record. From the root of the repository:
#
#     fair run data/src/prepare-evireliable.yaml
run_metadata:
  description: The mean EVI over the Africa box where it rests on enough months, as the seeding reads it
  default_input_namespace: AfricaPlants
  default_output_namespace: AfricaPlants
  script: |
    julia --project data/src/evi_reliable.jl --force

register:
- namespace: AfricaPlants
  full_name: AfricaPlants
  website: https://github.com/boydorr/AfricaPlants.jl

# Each source's files and records in its own namespace, and each table of ours in this one.
read:
- data_product: CaseStudy/Data/EVIMean/data/*
- data_product: CaseStudy/Data/EVIMean/provenance/*

write:
- data_product: CaseStudy/Data/EVIReliable/data/*
  description: Mean MODIS EVI over the Africa box where it rests on enough months
  file_type: tif
- data_product: CaseStudy/Data/EVIReliable/provenance/*
  description: EcoSISTEM's provenance record of the table
  file_type: toml
